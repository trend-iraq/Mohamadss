<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="description" content="ترند العراق - متجرك الأول للموضة والتقنية. توصيل لجميع المحافظات والدفع عند الاستلام." />
  <meta name="theme-color" content="#dc2626" id="themeColorMeta" />
  <title>ترند العراق - متجرك الأول</title>

  <!-- فتح الاتصالات مبكراً لتسريع التحميل -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://trendiraq.b-cdn.net" crossorigin>

  <!-- الخطوط: أوزان أقل = تحميل أسرع -->
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&family=Cairo:wght@700;900&display=swap" rel="stylesheet">

  <!-- ملف التنسيقات: رابط ثابت حتى يستفيد من الكاش. غيّر الرقم فقط عند تعديل الملف -->
  <link rel="stylesheet" href="styles.css?v=2" />

  <link rel="icon" type="image/webp" href="assets/logo.webp" />
  <link rel="preload" as="image" href="assets/logo.webp" />

  <!-- تحميل مسبق للسكربتات (يبدأ التنزيل قبل التنفيذ) -->
  <link rel="modulepreload" href="firebase-config.js?v=2" />
  <link rel="modulepreload" href="app.js?v=2" />

  <!-- تنسيقات حرجة مضمّنة: تظهر فوراً حتى قبل تحميل styles.css -->
  <style>
    :root { --primary:#dc2626; --bg:#fafaf9; --border:#e7e5e4; }
    html { background: var(--bg); }
    body { margin:0; font-family:'Tajawal',system-ui,sans-serif; background:var(--bg); }
    .boot { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
            justify-content:center; gap:16px; background:var(--bg); z-index:9999; }
    .boot img { width:96px; height:96px; object-fit:contain; border-radius:20px; }
    .boot .sp { width:44px; height:44px; border:4px solid var(--border);
                border-top-color:var(--primary); border-radius:50%; animation:bspin .8s linear infinite; }
    .boot p { color:#78716c; font-size:14px; margin:0; }
    @keyframes bspin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- شاشة التحميل -->
  <div id="loadingScreen" class="boot">
    <img src="assets/logo.webp" alt="ترند العراق" width="96" height="96" />
    <div class="sp"></div>
    <p>جاري التحميل...</p>
  </div>

  <!-- التطبيق -->
  <div id="app" style="display:none;"></div>

  <!-- نقطة الدخول الوحيدة. app.js يستورد firebase-config.js بنفسه -->
  <script type="module" src="app.js?v=2"></script>

  <!-- رسالة احتياطية إذا فشل تحميل السكربت خلال 12 ثانية -->
  <script>
    setTimeout(function () {
      var ls = document.getElementById('loadingScreen');
      if (ls && ls.style.display !== 'none' && !window.__storeReady) {
        ls.innerHTML = '<div style="text-align:center;padding:24px;font-family:Tajawal,sans-serif;">' +
          '<div style="font-size:48px;margin-bottom:12px;">⚠️</div>' +
          '<h3 style="color:#dc2626;margin:0 0 8px;">تعذّر تحميل المتجر</h3>' +
          '<p style="color:#78716c;margin:0 0 16px;">تأكد من اتصالك بالإنترنت</p>' +
          '<button onclick="location.reload()" style="background:#dc2626;color:#fff;border:none;' +
          'padding:12px 24px;border-radius:12px;font-family:inherit;font-size:15px;">إعادة المحاولة</button></div>';
      }
    }, 12000);
  </script>
</body>
</html>
